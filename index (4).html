<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>좀비 생존 알고리즘 · 탐색과 정렬</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F0E6; --card:#FFFDF8; --ink:#25222E; --muted:#6A6475; --line:#E3DACB;
  --primary:#2E7D5B; --primary-d:#22604A; --primary-l:#E3F1EA;
  --amber:#E9982F; --amber-l:#FDF0DC; --coral:#D85C48; --coral-l:#FBE6E1;
  --blue:#3A69B0; --blue-l:#E4ECF8; --zombie:#7FB74A; --dim:#D9D2C4;
  --radius:16px; --shadow:0 2px 0 rgba(37,34,46,.06), 0 8px 24px rgba(37,34,46,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,.display{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400;letter-spacing:-.01em;line-height:1.3;margin:0}
h1{font-size:2rem} h2{font-size:1.55rem} h3{font-size:1.2rem}
p{margin:.4em 0}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:.88rem}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;background:rgba(245,240,230,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1080px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:8px;font-family:'Jua',sans-serif;font-size:1.2rem;background:none;border:0;cursor:pointer;padding:4px 6px;border-radius:10px}
.logo:hover{background:#ece5d6}
.logo .em{font-size:1.4rem}
.who{margin-left:auto;font-size:.9rem;background:var(--card);border:1px solid var(--line);padding:4px 12px;border-radius:999px}
.progress{max-width:1080px;margin:0 auto;padding:0 18px 10px}
.progress-label{display:flex;justify-content:space-between;font-size:.9rem;color:var(--muted);margin-bottom:6px;gap:8px;flex-wrap:wrap}
.progress-label b{color:var(--ink)}
.segs{display:flex;gap:4px}
.seg{flex:1;height:8px;border-radius:4px;background:var(--dim)}
.seg.done{background:var(--primary)}
.seg.now{background:var(--amber)}

/* ---------- layout ---------- */
main{max-width:1080px;margin:0 auto;padding:22px 18px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:820px){.grid3{grid-template-columns:1fr}}
@media (max-width:720px){.grid2{grid-template-columns:1fr} h1{font-size:1.6rem} h2{font-size:1.3rem} main{padding:16px 12px 120px} .card{padding:16px}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;transition:transform .08s, background .15s}
.btn:hover{background:#f3ede1}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-d)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#fff}
.btn.small{min-height:36px;padding:6px 12px;font-size:.9rem}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent}

/* bottom nav */
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,253,248,.97);border-top:1px solid var(--line);backdrop-filter:blur(6px)}
.navbar-in{max-width:1080px;margin:0 auto;padding:10px 18px;display:flex;gap:10px;align-items:center}
.navbar .spacer{flex:1}
.navbar .hint{font-size:.85rem;color:var(--muted)}
@media (max-width:560px){.navbar .hint{display:none}}

/* ---------- start / hub ---------- */
.hero{text-align:center;padding:12px 0 6px}
.hero .scene{font-size:3rem;letter-spacing:.2em;margin-bottom:6px}
.hero p{color:var(--muted)}
.form{max-width:520px;margin:18px auto 0}
.fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.field label{display:block;font-weight:600;font-size:.92rem;margin-bottom:4px}
.field input,.field select{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;background:#fff}
.field input:focus,.field select:focus,textarea:focus{outline:3px solid #9ccfb6;border-color:var(--primary)}
.sec-card{display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer;position:relative;border:2px solid var(--line)}
.sec-card:hover{border-color:var(--primary)}
.sec-card .ico{font-size:2.4rem}
.sec-card .code{font-size:.82rem;color:var(--muted)}
.sec-card.locked{cursor:not-allowed;border-style:dashed;background:#faf7f0;color:var(--muted);box-shadow:none}
.sec-card.locked:hover{border-color:var(--line)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:.82rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--primary-l);color:var(--primary-d);width:max-content}
.badge.amber{background:var(--amber-l);color:#9a5a0a}
.badge.gray{background:#eee8dc;color:var(--muted)}

/* ---------- story dialog ---------- */
.story{display:flex;gap:14px;align-items:flex-start;background:#26303A;color:#F4F1EA;border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.story .avatar{flex:none;width:56px;height:56px;border-radius:16px;background:#3C4C5B;display:grid;place-items:center;font-size:2rem}
.story .name{font-family:'Jua',sans-serif;color:#9fe0bf;font-size:1rem}
.story .lines p{margin:.2em 0;font-size:1.05rem}
.story .lines p.new{animation:fadein .35s ease}
.story .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.story .btn{background:#3C4C5B;border-color:#566a7c;color:#fff;min-height:40px}
.story .btn.primary{background:var(--primary);border-color:var(--primary)}
.story.mini{padding:12px 16px}
.story.mini .avatar{width:42px;height:42px;font-size:1.5rem;border-radius:12px}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- goals ---------- */
.goals{display:grid;gap:12px}
.goal{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.goal .n{flex:none;width:34px;height:34px;border-radius:10px;background:var(--primary);color:#fff;display:grid;place-items:center;font-family:'Jua',sans-serif;font-size:1.1rem}
.goal.attitude .n{background:var(--amber)}

/* ---------- concept + reason ---------- */
.concept{border:2px solid var(--primary);background:var(--primary-l);border-radius:var(--radius);padding:18px 20px}
.concept .tag{font-family:'Jua',sans-serif;color:var(--primary-d);font-size:1.05rem;margin-bottom:4px}
.concept p{font-size:1.06rem}
.reason{background:var(--card);border:1px dashed #bdb3a1;border-radius:var(--radius);padding:18px 20px}
.reason label{font-weight:700;display:block;margin-bottom:8px}
textarea{width:100%;min-height:76px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;resize:vertical;background:#fff}
.example{margin-top:12px;background:var(--blue-l);border-radius:12px;padding:12px 14px}
.example b{color:var(--blue)}

/* ---------- feedback ---------- */
.msg{border-radius:12px;padding:12px 16px;font-weight:600}
.msg.ok{background:var(--primary-l);color:var(--primary-d)}
.msg.warn{background:var(--amber-l);color:#8a4f06}
.msg.bad{background:var(--coral-l);color:#9b3424}
.msg.info{background:var(--blue-l);color:#264d86}

/* ---------- zombie track ---------- */
.ztrack{background:#2C3440;border-radius:14px;padding:12px 14px;color:#f1eee6}
.ztrack .zlabel{display:flex;justify-content:space-between;gap:8px;font-size:.92rem;margin-bottom:8px;flex-wrap:wrap}
.ztrack .zlabel b{color:#ffd28a}
.zlane{position:relative;height:44px;display:flex;gap:3px;align-items:center}
.zcell{flex:1;height:10px;border-radius:3px;background:#46525f}
.zcell.passed{background:#6d8a4a}
.zwho{position:absolute;top:0;font-size:1.9rem;line-height:44px;transition:left .35s ease;transform:translateX(-50%)}
.zhome{flex:none;font-size:1.7rem;margin-left:6px}
.ztrack.arrived{animation:shake .4s}
.ztrack.arrived .zlabel b{color:#ff9b8a}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* ---------- radio / guess ---------- */
.guess{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.guess input{width:130px;min-height:52px;font-size:1.3rem;text-align:center;border:2px solid var(--line);border-radius:12px}
.hist{display:flex;flex-wrap:wrap;gap:6px}
.hist .h{padding:4px 10px;border-radius:999px;background:#eee7da;font-size:.92rem;font-weight:600}
.hist .h.up{background:var(--blue-l);color:#264d86}
.hist .h.down{background:var(--amber-l);color:#8a4f06}
.hist .h.hit{background:var(--primary);color:#fff}
.radio{font-size:3rem;text-align:center}

/* ---------- boxes (search) ---------- */
.target{display:inline-flex;align-items:center;gap:8px;background:var(--coral-l);color:#8c2e1f;border-radius:12px;padding:8px 14px;font-weight:700}
.boxes{display:grid;grid-template-columns:repeat(10,1fr);gap:8px}
@media (max-width:720px){.boxes{grid-template-columns:repeat(5,1fr)}}
.box{aspect-ratio:1/1;border-radius:12px;border:2px solid #d2a35d;background:linear-gradient(#f6c983,#e9a54b);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:1.15rem;position:relative;padding:0;color:#5b3a10}
.box .lid{font-size:1.5rem}
.box:hover:not(.open){transform:translateY(-2px)}
.box.open{background:#fff;border-color:var(--line);cursor:default;color:var(--ink)}
.box.hit{background:var(--primary);border-color:var(--primary);color:#fff}
.box.guide{outline:4px solid var(--amber);outline-offset:2px}

.cells{display:grid;grid-template-columns:repeat(31,1fr);gap:4px}
@media (max-width:900px){.cells{grid-template-columns:repeat(16,1fr)}}
.cell{border-radius:8px;border:2px solid #9bb7d8;background:#dce8f6;min-height:62px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 0;position:relative}
.cell .idx{font-size:.7rem;color:#516a88}
.cell .val{font-weight:800;font-size:1rem}
.cell.out{background:#ece8df;border-color:#ddd6c8;opacity:.45;cursor:not-allowed}
.cell.open{background:#fff;border-color:#7a93b3}
.cell.hit{background:var(--primary);border-color:var(--primary);color:#fff}
.cell.hit .idx{color:#d8f0e4}
.cell.mid{outline:3px solid var(--amber);outline-offset:1px;animation:pulse 1.2s infinite}
.cell.mid::after{content:'가운데';position:absolute;bottom:-20px;font-size:.68rem;color:#9a5a0a;font-weight:700;white-space:nowrap}
@keyframes pulse{50%{outline-color:#f7c77d}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.86rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:16px;height:16px;border-radius:4px;border:1.5px solid #9bb7d8}

/* ---------- simulation ---------- */
.sim-ctrl{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.sim-ctrl .field{min-width:160px}
.sim-ctrl input[type=range]{width:100%;accent-color:var(--primary)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.panel h3{display:flex;justify-content:space-between;align-items:center;gap:8px}
.counter{font-family:'Jua',sans-serif;font-size:1.05rem;background:#25222e;color:#fff;border-radius:10px;padding:2px 12px}
.panel canvas{width:100%;display:block;margin-top:10px;border-radius:8px}
.panel .say{min-height:3.2em;font-size:.92rem;color:var(--muted);margin-top:8px}
.panel.win{border:2px solid var(--primary)}
.table{width:100%;border-collapse:collapse;font-size:.95rem;background:#fff;border-radius:12px;overflow:hidden}
.table th,.table td{border:1px solid var(--line);padding:8px 10px;text-align:center}
.table th{background:#efe8da}
.table tr.hl td{background:var(--amber-l);font-weight:700}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{text-align:left;min-height:52px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:#fff;cursor:pointer;font-weight:600}
.opt:hover:not([disabled]){border-color:var(--primary)}
.opt.sel{border-color:var(--blue);background:var(--blue-l)}
.opt.right{border-color:var(--primary);background:var(--primary-l)}
.opt.wrong{border-color:var(--coral);background:var(--coral-l)}
.opt[disabled]{cursor:default}

/* ---------- fill blanks ---------- */
.fill td{text-align:left;vertical-align:top}
.fill select{min-height:40px;border-radius:10px;border:2px solid #b8c9e0;background:#f4f8fd;padding:4px 8px;max-width:100%}
.fill select.ok{border-color:var(--primary);background:var(--primary-l)}
.fill select.no{border-color:var(--coral);background:var(--coral-l)}
.mark{font-weight:700;font-size:.85rem;margin-left:4px}

/* ---------- quiz ---------- */
.q{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
.q .qn{font-family:'Jua',sans-serif;color:var(--primary-d)}
.q .prompt{font-weight:700;margin:4px 0 12px;font-size:1.05rem}
.q .expl{margin-top:12px;border-radius:12px;padding:12px 14px}
.q .expl.ok{background:var(--primary-l)}
.q .expl.bad{background:var(--coral-l)}
.q .qtag{font-size:.78rem;color:var(--muted);float:right}
.check{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.check span{padding:4px 10px;border-radius:999px;font-size:.88rem;font-weight:700}
.check .y{background:var(--primary-l);color:var(--primary-d)}
.check .n{background:#eee7da;color:var(--muted)}

/* ---------- sorting tiles ---------- */
.tiles{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:flex-end;padding:20px 4px 8px;min-height:120px}
.tile{width:62px;height:70px;border-radius:12px;border:2.5px solid #d2a35d;background:linear-gradient(#f6c983,#e9a54b);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:1.35rem;cursor:pointer;position:relative;transition:transform .2s, background .2s;color:#5b3a10;padding:0}
.tile small{font-size:.66rem;font-weight:700;opacity:.8}
.tile:hover:not([disabled]){transform:translateY(-3px)}
.tile.sel{outline:4px solid var(--blue);outline-offset:2px;transform:translateY(-6px)}
.tile.fixed{background:var(--primary-l);border-color:var(--primary);color:var(--primary-d)}
.tile.pair{outline:4px solid var(--amber);outline-offset:2px}
.tile.key{transform:translateY(-22px);outline:4px solid var(--blue);outline-offset:2px}
.tile.hintme{animation:wiggle .5s 2}
.tile[disabled]{cursor:default}
.tile.ghost{background:transparent;border-style:dashed;color:transparent}
@keyframes wiggle{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@media (max-width:560px){.tile{width:38px;height:54px;font-size:1.05rem;border-radius:9px}.tiles{gap:4px;padding:18px 0 6px}}
.slot{width:26px;height:70px;border-radius:8px;border:2px dashed #8aa7cc;background:#eef4fb;cursor:pointer;display:grid;place-items:center;color:#3a69b0;font-weight:800;padding:0}
.slot:hover{background:#d8e6f7}
@media (max-width:560px){.slot{width:14px;height:54px;border-radius:6px}}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs .t{padding:6px 14px;border-radius:999px;background:#eee7da;font-weight:700;font-size:.92rem}
.tabs .t.now{background:var(--amber);color:#fff}
.tabs .t.done{background:var(--primary);color:#fff}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:700}
.stat b{font-family:'Jua',sans-serif;font-size:1.2rem;color:var(--primary-d);margin-left:6px}
.rule{background:#fff;border-left:5px solid var(--amber);border-radius:10px;padding:10px 14px}

/* ---------- report ---------- */
.report .big{font-family:'Jua',sans-serif;font-size:2.6rem;color:var(--primary-d)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:4px 12px;border-radius:999px;background:var(--coral-l);color:#9b3424;font-weight:700;font-size:.9rem}
.chip.ok{background:var(--primary-l);color:var(--primary-d)}
.codebox{width:100%;font-family:ui-monospace,Menlo,monospace;font-size:.75rem;min-height:70px}
.cert{background:#fffaf0;border:6px double #c9a35a;border-radius:18px;padding:28px;text-align:center}
.cert h2{font-size:2rem;color:#7a5512}
.cert .seal{font-size:3rem}
.path{display:inline-flex;align-items:center;gap:6px;font-weight:700;padding:6px 14px;border-radius:999px}
.path.p1{background:var(--coral-l);color:#9b3424}
.path.p2{background:var(--amber-l);color:#8a4f06}
.path.p3{background:var(--blue-l);color:#264d86}
.halve{display:flex;flex-direction:column;gap:4px;font-family:ui-monospace,Menlo,monospace;font-size:.92rem;max-height:260px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.halve div{display:flex;gap:10px;align-items:center}
.halve .bar{height:10px;background:var(--primary);border-radius:4px;min-width:2px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#25222e;color:#fff;padding:10px 18px;border-radius:12px;z-index:50;font-weight:600;animation:fadein .2s}

</style>
</head>
<body>
<div id="app"></div>
<script>
/* =========================================================
   좀비 생존 알고리즘 코스웨어
   ---------------------------------------------------------
   [교사 설정] 구글 시트 연동
   - 이 파일을 앱스 스크립트 웹앱(index.html)으로 함께 배포하면
     아무것도 바꾸지 않아도 결과가 시트에 저장됩니다.
   - 다른 곳(예: GitHub Pages)에 올릴 때만 아래 SCRIPT_URL에
     앱스 스크립트 웹앱 주소(…/exec)를 붙여 넣으세요.
   ========================================================= */
const CONFIG = {
  SCRIPT_URL: '',          // 예: 'https://script.google.com/macros/s/XXXX/exec'
  ZOMBIE: '🧟',            // 무서워하는 학생이 많으면 '🌊'(재난) 등으로 바꿔도 됩니다
};

/* ---------------- 유틸 ---------------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
function h(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
const rand = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function sampleDistinct(k, lo, hi) { const s = new Set(); while (s.size < k) s.add(rand(lo, hi)); return [...s]; }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const isSorted = a => a.every((v, i) => i === 0 || a[i - 1] <= v);
function toast(t, ms = 1800) { const el = h(`<div class="toast" role="status">${esc(t)}</div>`); document.body.appendChild(el); setTimeout(() => el.remove(), ms); }

/* ---------------- 상태 ---------------- */
const STORE_KEY = 'zsa-v1';
let S = (() => { try { return JSON.parse(sessionStorage.getItem(STORE_KEY)) || null; } catch (e) { return null; } })() || { student: null, sec: {}, view: 'start' };
function save() { try { sessionStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { } }
function secState(id) {
  if (!S.sec[id]) S.sec[id] = { step: 0, done: {}, logs: {}, reasons: {}, quiz: { answers: {}, essay: null }, startedAt: Date.now(), complete: false, sent: false };
  return S.sec[id];
}

/* ---------------- 섹션 등록 ---------------- */
const SECTIONS = {}; // search, sort 가 아래 파일에서 등록됨

/* ---------------- 레이아웃 ---------------- */
const app = () => $('#app');
function renderTop(progress) {
  const st = S.student;

}
function bindTop(root) { const b = $('[data-act=hub]', root); if (b) b.onclick = () => { if (S.student) goHub(); }; }

/* ---------------- 시작 화면 ---------------- */

/* ---------------- 허브 ---------------- */
function goHub() {
  S.view = 'hub'; save();
  const card = (id) => {
    const d = SECTIONS[id]; const ss = S.sec[id];
    let badge = '<span class="badge gray">시작 전</span>';

    return `<button class="card sec-card" data-sec="${id}"><span class="ico" aria-hidden="true">${d.icon}</span><span class="code">${d.std}</span><h2>${d.label}</h2><span>${d.desc}</span>${badge}</button>`;
  };

  <main class="stack">

    </div>

  </main>`;

/* ---------------- 단계 이동 ---------------- */
let CLEANUP = [];
function cleanup() { CLEANUP.forEach(f => { try { f(); } catch (e) { } }); CLEANUP = []; }
function goStep(secId, step) {
  cleanup();
  const def = SECTIONS[secId]; const ss = secState(secId);
  ss.step = step; S.view = 'step'; save();
  const last = step === def.steps.length - 1;
  app().innerHTML = renderTop({ sec: secId, step }) + `<main id="stage" class="stack"></main>
  <nav class="navbar" aria-label="단계 이동"><div class="navbar-in">
    <button class="btn" id="prevBtn" ${step === 0 ? 'disabled' : ''}>◀ 이전</button>
    <button class="btn ghost" id="homeBtn">🏠 처음으로</button>
    <span class="spacer"></span><span class="hint" id="navHint"></span>
    <button class="btn primary" id="nextBtn">${last ? '허브로 ▶' : '다음 ▶'}</button>
  </div></nav>`;
  bindTop(app());
  window.scrollTo(0, 0);
  const next = $('#nextBtn'), hint = $('#navHint');
  const refresh = () => { const ok = !!ss.done[step]; next.disabled = !ok; hint.textContent = ok ? '' : '활동을 마치면 다음으로 갈 수 있어요'; };
  const ctx = {
    secId, step, ss, def,
    markDone() { if (!ss.done[step]) { ss.done[step] = true; save(); } refresh(); },
    log(k, v, overwrite = false) { if (overwrite || ss.logs[k] === undefined) { ss.logs[k] = v; save(); } },
    save,
  };
  $('#prevBtn').onclick = () => goStep(secId, step - 1);
  $('#homeBtn').onclick = () => { cleanup(); goHub(); };
  next.onclick = () => { if (!ss.done[step]) return; if (last) { cleanup(); goHub(); } else goStep(secId, step + 1); };
  refresh();
  def.steps[step].render($('#stage'), ctx);
}

/* 스토리 대화창: 대사 2~3줄 + 건너뛰기 */
function story(root, lines, { name = '세이프', avatar = '🤖', skip = false, cta = '임무 시작 ▶' } = {}) {
  return new Promise(resolve => {
    const el = h(`<section class="story" aria-live="polite"><div class="avatar" aria-hidden="true">${avatar}</div><div style="flex:1"><div class="name">${esc(name)}</div><div class="lines"></div><div class="acts"><button class="btn small primary" data-a="next">다음 ▶</button><button class="btn small" data-a="skip">건너뛰기 ⏭</button></div></div></section>`);
    root.appendChild(el);
    const box = $('.lines', el); let i = 0;
    const finish = () => { box.innerHTML = lines.map(l => `<p>${l}</p>`).join(''); $('.acts', el).remove(); el.classList.add('mini'); resolve(); };
    const show = () => {
      if (i < lines.length) { const p = h(`<p class="new">${lines[i]}</p>`); box.appendChild(p); i++; }
      if (i >= lines.length) { $('[data-a=next]', el).textContent = cta; $('[data-a=skip]', el).classList.add('hidden'); }
    };
    if (skip) { finish(); return; }
    show();
    $('[data-a=next]', el).onclick = () => { if (i >= lines.length) finish(); else show(); };
    $('[data-a=skip]', el).onclick = finish;
  });
}

/* 좀비 접근 표시: 행동 1번 = 한 칸 */
function zombieTrack(max) {
  const el = h(`<div class="ztrack" role="status" aria-live="polite"><div class="zlabel"><span>${CONFIG.ZOMBIE} 좀비가 다가오고 있어요</span><span>남은 거리 <b class="zleft">${max}칸</b></span></div>
    <div class="zlane"><div style="flex:1;position:relative;display:flex;gap:3px;align-items:center;height:44px">${'<span class="zcell"></span>'.repeat(max)}<span class="zwho" aria-hidden="true">${CONFIG.ZOMBIE}</span></div><span class="zhome" aria-hidden="true">🏠</span></div>
    <div class="zmsg small hidden" style="margin-top:6px;color:#ffd2c8;font-weight:700"></div></div>`);
  let used = 0;
  const cells = $$('.zcell', el), who = $('.zwho', el), left = $('.zleft', el), msg = $('.zmsg', el);
  const draw = () => {
    const u = Math.min(used, max);
    cells.forEach((c, i) => c.classList.toggle('passed', i < u));
    who.style.left = `${(u / max) * 100}%`;
    left.textContent = used >= max ? '도착!' : `${max - used}칸`;
  };
  draw();
  return {
    el,
    step(k = 1) {
      const before = used; used += k; draw();
      if (before < max && used >= max) { el.classList.remove('arrived'); void el.offsetWidth; el.classList.add('arrived'); msg.textContent = '아슬아슬했어요! 좀비가 문 앞까지 왔지만 문을 꼭 잠갔어요. 임무는 계속돼요!'; msg.classList.remove('hidden'); }
    },
    get used() { return used; },
    reset() { used = 0; draw(); msg.classList.add('hidden'); el.classList.remove('arrived'); },
  };
}

/* 객관식 문항 한 개: 즉시 정답·해설 */
function questionCard(q, idx, { saved, onAnswer, label } = {}) {
  const el = h(`<div class="q"><span class="qtag">#${esc(q.tag)}</span><div class="qn">${label || '문항 ' + (idx + 1)}</div><div class="prompt">${q.prompt}</div><div class="opts">${q.options.map((o, i) => `<button class="opt" data-i="${i}">${String.fromCharCode(9312 + i)} ${o}</button>`).join('')}</div><div class="expl hidden"></div></div>`);
  const opts = $$('.opt', el), ex = $('.expl', el);
  const reveal = (choice) => {
    opts.forEach((b, i) => { b.disabled = true; if (i === q.answer) b.classList.add('right'); if (i === choice && i !== q.answer) b.classList.add('wrong'); });
    const ok = choice === q.answer;
    ex.className = 'expl ' + (ok ? 'ok' : 'bad');
    ex.innerHTML = `<b>${ok ? '✅ 정답이에요!' : '❌ 아쉬워요. 정답은 ' + String.fromCharCode(9312 + q.answer) + '번이에요.'}</b><br>${q.expl}`;
    return ok;
  };
  if (saved !== undefined && saved !== null) reveal(saved);
  else opts.forEach((b, i) => b.onclick = () => { const ok = reveal(i); onAnswer && onAnswer(i, ok); });
  return el;
}

/* 빈칸 채우기 표 */
function fillTable(root, { head, rows }, onAllRight) {
  // rows: [[label, cell, cell...]] ; cell: string with {{answer|opt1|opt2}} tokens
  let n = 0; const answers = [];
  const cellHtml = c => c.replace(/\{\{(.+?)\}\}/g, (_, body) => {
    const parts = body.split('|'); const ans = parts[0]; const opts = shuffle(parts);
    answers.push(ans); const id = n++;
    return `<select data-b="${id}" aria-label="빈칸 ${id + 1}"><option value="">  ? 고르기  </option>${opts.map(o => `<option>${esc(o)}</option>`).join('')}</select><span class="mark" data-m="${id}"></span>`;
  });
  const el = h(`<div class="stack"><div style="overflow-x:auto"><table class="table fill"><thead><tr>${head.map(x => `<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr><th>${r[0]}</th>${r.slice(1).map(c => `<td>${cellHtml(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <div class="row"><button class="btn primary small" data-a="chk">확인하기</button><span class="fmsg small"></span></div></div>`);
  root.appendChild(el);
  let tries = 0;
  $('[data-a=chk]', el).onclick = () => {
    tries++; let right = 0;
    $$('select', el).forEach(s => {
      const id = +s.dataset.b; const ok = s.value === answers[id];
      s.classList.toggle('ok', ok); s.classList.toggle('no', !ok);
      $(`[data-m="${id}"]`, el).textContent = ok ? '✓ 맞음' : '✗ 다시';
      if (ok) right++;
    });
    const m = $('.fmsg', el);
    if (right === answers.length) { m.innerHTML = '<b style="color:var(--primary-d)">모두 맞았어요! 🎉</b>'; $$('select', el).forEach(s => s.disabled = true); $('[data-a=chk]', el).disabled = true; onAllRight && onAllRight(); }
    else if (tries >= 2) { m.innerHTML = `${right}/${answers.length}개 맞음 · <button class="btn small" data-a="show">정답 보기</button>`; $('[data-a=show]', el).onclick = () => { $$('select', el).forEach(s => { s.value = answers[+s.dataset.b]; }); $('[data-a=chk]', el).click(); }; }
    else m.textContent = `${right}/${answers.length}개 맞음 · ‘✗ 다시’ 칸을 고쳐 보세요.`;
  };
  return el;
}

/* 형성평가 묶음 (객관식 5 + 서술형 1) */
function formativeBlock(root, ctx, { questions, essay, onComplete }) {
  const ss = ctx.ss; const A = ss.quiz.answers;
  const wrap = h(`<div class="stack"></div>`); root.appendChild(wrap);
  const status = h(`<div class="msg info">문항을 풀면 바로 정답과 해설이 나와요. 객관식 5문항 + 서술형 1문항</div>`);
  wrap.appendChild(status);
  const check = () => {
    const nAns = questions.filter(q => A[q.id] !== undefined).length;
    if (nAns === questions.length && ss.quiz.essay) {
      const score = questions.filter(q => A[q.id] === q.answer).length;
      const wrong = questions.filter(q => A[q.id] !== q.answer).map(q => q.tag);
      ss.score = score; ss.wrongTags = wrong; save();
      status.className = 'msg ok'; status.innerHTML = `형성평가 완료! 객관식 <b>${score}/5</b>점이에요. ‘다음’을 눌러 나에게 맞는 경로로 가요.`;
      onComplete && onComplete(score, wrong);
    } else status.textContent = `문항을 풀면 바로 정답과 해설이 나와요. (객관식 ${nAns}/5 · 서술형 ${ss.quiz.essay ? '1/1' : '0/1'})`;
  };
  questions.forEach((q, i) => wrap.appendChild(questionCard(q, i, { saved: A[q.id], onAnswer: (c) => { A[q.id] = c; save(); check(); } })));
  // 서술형
  const es = h(`<div class="q"><span class="qtag">#${esc(essay.tag)}</span><div class="qn">문항 6 (서술형)</div><div class="prompt">${essay.prompt}</div>
    <textarea placeholder="한두 문장으로 써 보세요."></textarea><div class="row" style="margin-top:8px"><button class="btn primary small" disabled>제출하기</button><span class="small muted">서술형은 선생님이 읽고 피드백해 줘요.</span></div><div class="expl hidden"></div></div>`);
  wrap.appendChild(es);
  const ta = $('textarea', es), b = $('button', es), ex = $('.expl', es);
  ta.oninput = () => b.disabled = ta.value.trim().length < 2;
  const showEx = (txt) => {
    const hits = essay.keywords.map(k => ({ k: k.label, y: k.re.test(txt) }));
    ex.className = 'expl ok'; ex.classList.remove('hidden');
    ex.innerHTML = `<b>예시 답안</b><br>${essay.example}<div style="margin-top:8px" class="small">내 답에 이 낱말(생각)이 들어갔는지 스스로 확인해 보세요.</div><div class="check">${hits.map(x => `<span class="${x.y ? 'y' : 'n'}">${x.y ? '✓' : '○'} ‘${x.k}’</span>`).join('')}</div>`;
  };
  b.onclick = () => { ss.quiz.essay = ta.value.trim(); save(); ta.disabled = true; b.disabled = true; b.textContent = '제출 완료 ✓'; showEx(ss.quiz.essay); check(); };
  if (ss.quiz.essay) { ta.value = ss.quiz.essay; ta.disabled = true; b.textContent = '제출 완료 ✓'; showEx(ss.quiz.essay); }
  check();
}

/* 분기 경로 결정: 객관식 정답 수 기준 */
function decidePath(score) { return score <= 2 ? '보충' : score <= 4 ? '맞춤 복습' : '심화'; }

/* 재평가 묶음 */
function retestBlock(root, qs, onDone, { title = '재평가' } = {}) {
  const wrap = h(`<div class="stack"><h3>📝 ${title} (${qs.length}문항)</h3></div>`); root.appendChild(wrap);
  const res = []; let cnt = 0;
  qs.forEach((q, i) => wrap.appendChild(questionCard(q, i, { label: `${title} ${i + 1}`, onAnswer: (c, ok) => { res[i] = ok; cnt++; if (cnt === qs.length) onDone(res.every(Boolean)); } })));
  return wrap;
}

/* =========================================================
   결과 전송 (구글 시트) + 리포트
   ========================================================= */
function b64(str) { return btoa(unescape(encodeURIComponent(str))); }
function sendResult(payload) {
  return new Promise((resolve) => {
    // 1) 앱스 스크립트 웹앱으로 함께 배포한 경우
    if (window.google && google.script && google.script.run) {
      google.script.run.withSuccessHandler(r => resolve(r || { ok: true })).withFailureHandler(e => resolve({ ok: false, error: String(e && e.message || e) })).saveResult(payload);
      return;
    }
    // 2) 다른 곳에 올리고 SCRIPT_URL을 설정한 경우
    if (CONFIG.SCRIPT_URL) {
      fetch(CONFIG.SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
        .then(r => r.json()).then(resolve).catch(e => resolve({ ok: false, error: '네트워크 오류' }));
      return;
    }
    // 3) 연결 전(체험 모드)
    resolve({ ok: false, demo: true, error: '아직 구글 시트와 연결되지 않았어요(체험 모드).' });
  });
}

function buildPayload(secId) {
  const ss = secState(secId); const st = S.student || {}; const def = SECTIONS[secId];
  const minutes = Math.max(1, Math.round(((ss.finishedAt || Date.now()) - ss.startedAt) / 60000));
  const p = {
    code: st.code, grade: st.grade, cls: st.cls, num: st.num,
    section: def.label, score: ss.score ?? '', wrongTags: (ss.wrongTags || []).join(', '),
    path: ss.path || '', retest: ss.retest || '', predict: ss.logs.predict === undefined ? '' : (ss.logs.predict ? '정답' : '오답'),
    essay: ss.quiz.essay || '', minutes,
  };
  def.payload(ss, p); // act1~3, r1~r6
  return p;
}

function sendPanel(root, secId) {
  const ss = secState(secId);
  const el = h(`<div class="card stack"><h3>☁️ 선생님께 결과 보내기</h3><div class="smsg msg info">결과를 보내는 중이에요…</div>
    <div class="row sacts hidden"><button class="btn small primary" data-a="retry">🔁 다시 보내기</button><button class="btn small" data-a="copy">📋 결과 코드 복사</button></div>
    <textarea class="codebox hidden" readonly aria-label="결과 코드"></textarea></div>`);
  root.appendChild(el);
  const m = $('.smsg', el), acts = $('.sacts', el), box = $('.codebox', el);
  const payload = buildPayload(secId);
  const code = 'ZSA1.' + b64(JSON.stringify(payload));
  const go = async () => {
    m.className = 'smsg msg info'; m.textContent = '결과를 보내는 중이에요…';
    const r = await sendResult(payload);
    if (r && r.ok) { ss.sent = true; save(); m.className = 'smsg msg ok'; m.textContent = '✅ 저장됐어요! 선생님이 결과를 확인할 수 있어요.'; acts.classList.add('hidden'); }
    else { m.className = 'smsg msg ' + (r && r.demo ? 'warn' : 'bad'); m.textContent = (r && r.demo ? '🧪 ' : '⚠️ 저장하지 못했어요: ') + (r && r.error || '알 수 없는 오류') + (r && r.demo ? ' 아래 ‘결과 코드 복사’로 선생님께 제출할 수 있어요.' : ' ‘다시 보내기’를 눌러 보고, 그래도 안 되면 결과 코드를 복사해 선생님께 보내 주세요.'); acts.classList.remove('hidden'); }
  };
  $('[data-a=retry]', el).onclick = go;
  $('[data-a=copy]', el).onclick = async () => {
    box.value = code; box.classList.remove('hidden');
    try { await navigator.clipboard.writeText(code); toast('결과 코드를 복사했어요. 선생님께 붙여 넣어 보내 주세요.'); }
    catch (e) { box.focus(); box.select(); toast('아래 코드를 길게 눌러 복사해 주세요.'); }
  };
  if (ss.sent) { m.className = 'smsg msg ok'; m.textContent = '✅ 이미 저장된 결과예요.'; acts.classList.remove('hidden'); $('[data-a=retry]', el).textContent = '🔁 한 번 더 보내기'; }
  else go();
}

function reportBlock(root, secId, activityRows) {
  const ss = secState(secId); const def = SECTIONS[secId];
  if (!ss.finishedAt) { ss.finishedAt = Date.now(); }
  ss.complete = true; save();
  const minutes = Math.max(1, Math.round((ss.finishedAt - ss.startedAt) / 60000));
  const pathCls = { '보충': 'p1', '맞춤 복습': 'p2', '심화': 'p3' }[ss.path] || 'p3';
  const wrong = ss.wrongTags || [];
  const el = h(`<div class="card report stack">
    <h2>📊 ${def.label} 학습 리포트</h2>
    <div class="grid2">
      <div class="stack">
        <div><div class="muted small">형성평가 (객관식)</div><div class="big">${ss.score}<span style="font-size:1.2rem"> / 5</span></div></div>
        <div><div class="muted small">틀린 개념</div><div class="chips">${wrong.length ? wrong.map(t => `<span class="chip">${esc(t)}</span>`).join('') : '<span class="chip ok">없음 🎉</span>'}</div></div>
        <div><div class="muted small">거친 경로 · 재평가</div><span class="path ${pathCls}">${esc(ss.path || '-')}</span> <span class="badge ${ss.retest === '미통과' ? 'amber' : ''}">${esc(ss.retest || '-')}</span></div>

  root.appendChild(el);

/* 캔버스 크기 맞춤 */
function fitCanvas(cv, cssH) {
  const dpr = window.devicePixelRatio || 1; const w = cv.clientWidth || cv.parentElement.clientWidth || 300;
  cv.width = Math.round(w * dpr); cv.height = Math.round(cssH * dpr); cv.style.height = cssH + 'px';
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); return { c, w, h: cssH };
}

/* ---------- 활동: 순차 탐색 (뒤죽박죽 상자) ---------- */
function sequentialActivity(root, { n = 20, zmax = 20, guided = false, onFinish }) {
  const nums = sampleDistinct(n, 10, 99); const target = nums[rand(0, n - 1)];
  const el = h(`<div class="card stack"><div class="row" style="justify-content:space-between"><span class="target">💉 백신이 든 상자 번호: ${target}번</span><span class="stat">연 상자 <b class="cnt">0</b></span></div>
    ${guided ? `<div class="rule">👉 <b>순차 탐색 규칙</b>: 맨 앞(왼쪽 위)부터 <b>차례대로</b> 하나씩 열어요. 빛나는 상자를 눌러 보세요.</div>` : '<p class="muted small">상자를 눌러 열면 번호가 보여요. 백신 상자를 찾아보세요!</p>'}
    <div class="boxes">${nums.map((v, i) => `<button class="box" data-i="${i}" aria-label="${i + 1}번째 상자 (닫힘)"><span class="lid" aria-hidden="true">📦</span></button>`).join('')}</div>
    <div class="fb"></div></div>`);
  const zt = zombieTrack(zmax); el.insertBefore(zt.el, el.children[1]);
  root.appendChild(el);
  let opened = 0, found = false, nextIdx = 0;
  const boxes = $$('.box', el), cnt = $('.cnt', el), fb = $('.fb', el);
  const markGuide = () => boxes.forEach((b, i) => b.classList.toggle('guide', guided && !found && i === nextIdx));
  markGuide();
  boxes.forEach(b => b.onclick = () => {
    const i = +b.dataset.i; if (found || b.classList.contains('open')) return;
    if (guided && i !== nextIdx) { fb.innerHTML = '<div class="msg warn">순차 탐색은 건너뛰지 않고 앞에서부터 차례대로 확인해요. 빛나는 상자를 열어 보세요.</div>'; return; }
    opened++; cnt.textContent = opened; zt.step();
    b.classList.add('open'); b.innerHTML = `<span>${nums[i]}</span>`; b.setAttribute('aria-label', `${i + 1}번째 상자: ${nums[i]}번`);
    nextIdx = i + 1;
    if (nums[i] === target) {
      found = true; b.classList.add('hit'); b.innerHTML = `<span aria-hidden="true">💉</span><span>${nums[i]}</span>`;
      boxes.forEach(x => { if (!x.classList.contains('open')) x.disabled = true; });
      fb.innerHTML = `<div class="msg ok">백신 발견! 상자 <b>${opened}개</b>를 열었어요. 순서가 없으면 하나씩 열어 봐야 해요.</div>`;
      onFinish && onFinish(opened);
    } else fb.innerHTML = '';
    markGuide();
  });
  return el;
}

/* ---------- 활동: 이진 탐색 (번호순 창고) ---------- */
function binaryActivity(root, { n = 31, zmax = 10, guided = false, onFinish }) {
  const vals = sampleDistinct(n, 1, 99).sort((a, b) => a - b); const ti = rand(0, n - 1); const target = vals[ti];
  let lo = 0, hi = n - 1, opened = 0, midPicks = 0, found = false;
  const el = h(`<div class="card stack"><div class="row" style="justify-content:space-between"><span class="target">💉 백신 번호: ${target}</span><span class="row"><span class="stat">연 칸 <b class="cnt">0</b></span><span class="stat">남은 범위 <b class="rng">${n}칸</b></span></span></div>
    ${guided ? `<div class="rule">👉 <b>가운데 고르기 규칙</b>: 남은 범위의 <b>가운데 칸</b>을 열어요. 범위 칸 수가 짝수면 <b>왼쪽 가운데</b>를 골라요. ‘가운데’ 표시를 따라가 보세요.</div>` : '<p class="muted small">창고는 <b>번호순(작은 수 → 큰 수)</b>으로 정리되어 있어요. 칸을 열면 번호가 보이고, 백신이 있을 수 없는 칸은 흐려져요.</p>'}
    <div class="legend"><span><i style="background:#dce8f6"></i>남은 범위(닫힘)</span><span><i style="background:#fff"></i>연 칸</span><span><i style="background:#ece8df;border-color:#ddd6c8"></i>제외된 칸(흐림)</span></div>
    <div class="cells" style="${n < 31 ? `grid-template-columns:repeat(${n},1fr)` : ''}">${vals.map((v, i) => `<button class="cell" data-i="${i}" aria-label="${i + 1}번 칸 (닫힘)"><span class="idx">${i + 1}</span><span class="val">?</span></button>`).join('')}</div>
    <div class="fb" style="margin-top:18px"></div></div>`);
  const zt = zombieTrack(zmax); el.insertBefore(zt.el, el.children[1]);
  root.appendChild(el);
  const cells = $$('.cell', el), cnt = $('.cnt', el), rng = $('.rng', el), fb = $('.fb', el);
  const paint = () => {
    cells.forEach((c, i) => {
      const out = i < lo || i > hi;
      if (!c.classList.contains('hit')) c.classList.toggle('out', out);
      c.classList.toggle('mid', guided && !found && i === midOf(lo, hi));
    });
    rng.textContent = found ? '찾음!' : `${hi - lo + 1}칸`;
  };
  paint();
  cells.forEach(c => c.onclick = () => {
    if (found) return; const i = +c.dataset.i;
    if (i < lo || i > hi) { fb.innerHTML = '<div class="msg warn">이미 제외된 칸이에요. 밝은 칸(남은 범위)에서 골라 주세요.</div>'; return; }
    if (c.classList.contains('open')) return;
    const m = midOf(lo, hi);
    if (guided && i !== m) { fb.innerHTML = `<div class="msg warn">지금 남은 범위는 ${lo + 1}~${hi + 1}번 칸(${hi - lo + 1}칸)이에요. 가운데는 <b>${m + 1}번 칸</b>이에요${(hi - lo + 1) % 2 === 0 ? ' (짝수라 왼쪽 가운데)' : ''}.</div>`; return; }
    opened++; if (i === m) midPicks++; cnt.textContent = opened; zt.step();
    c.classList.add('open'); $('.val', c).textContent = vals[i]; c.setAttribute('aria-label', `${i + 1}번 칸: ${vals[i]}`);
    if (vals[i] === target) {
      found = true; c.classList.add('hit'); paint();
      fb.innerHTML = `<div class="msg ok">백신 발견! <b>${opened}칸</b>을 열었어요. (가장 적게 열면 ${binMax(n)}칸이면 충분해요${opened <= binMax(n) ? ' — 최고예요! 🎉' : ''})</div>`;
      onFinish && onFinish({ opened, midPicks });
    } else {
      const bigger = target > vals[i];
      if (bigger) lo = i + 1; else hi = i - 1;
      paint();
      fb.innerHTML = `<div class="msg info">${vals[i]}은(는) 백신 번호 ${target}보다 <b>${bigger ? '작아요' : '커요'}</b> → 백신은 <b>${bigger ? '오른쪽' : '왼쪽'}</b>에 있어요. ${bigger ? '왼쪽' : '오른쪽'} 칸들은 흐려졌어요.</div>`;
    }
  });
  return el;
}

/* ---------- 활동: 순차 vs 이진 시뮬레이션 ---------- */
function searchSim(root, ctx, onChecked) {
  const ss = ctx.ss;
  const el = h(`<div class="stack">
    <div class="card stack">
      <h3>🔮 먼저 예측해 보세요</h3>
      <p><b>창고 칸 수가 2배가 되면, 이진 탐색의 최대 비교 횟수는 어떻게 될까요?</b></p>
      <div class="opts pred">${['2배가 된다', '1번 늘어난다', '변하지 않는다', '절반이 된다'].map((o, i) => `<button class="opt" data-i="${i}">${String.fromCharCode(9312 + i)} ${o}</button>`).join('')}</div>
    </div>
    <div class="card stack simbox">
      <div class="sim-ctrl">
        <div class="field" style="flex:2"><label for="simN">창고 칸 수: <b class="nv">100</b>칸</label><input id="simN" type="range" min="10" max="1000" step="10" value="100"></div>
        <div class="field"><label for="simT">찾을 번호 (1~<span class="nmax">100</span>)</label><input id="simT" type="number" min="1" max="100" value="73" style="width:100%;min-height:44px;border:1.5px solid var(--line);border-radius:10px;padding:6px 10px"></div>
        <div class="field"><label for="simSp">재생 속도</label><input id="simSp" type="range" min="1" max="10" value="4"></div>
      </div>
      <div class="row"><button class="btn small" data-a="step">한 단계씩 ⏭</button><button class="btn small primary" data-a="play">자동 재생 ▶</button><button class="btn small" data-a="reset">초기화 ↺</button><button class="btn small ghost" data-a="rnd">🎲 번호 무작위</button></div>
      <div class="grid2">
        <div class="panel" id="pSeq"><h3><span>🚶 순차 탐색</span><span class="counter">비교 <span class="c">0</span>번</span></h3><canvas></canvas><div class="say">앞에서부터 한 칸씩 확인해요.</div></div>
        <div class="panel" id="pBin"><h3><span>✂️ 이진 탐색</span><span class="counter">비교 <span class="c">0</span>번</span></h3><canvas></canvas><div class="say">가운데를 확인하고 절반을 지워요.</div></div>
      </div>
      <div class="legend"><span><i style="background:#E9982F;border-color:#E9982F"></i>지금 확인하는 칸</span><span><i style="background:#2E7D5B;border-color:#2E7D5B"></i>찾은 칸</span><span><i style="background:#b9b2a5;border-color:#b9b2a5"></i>확인함/제외됨</span><span><i style="background:#dce8f6"></i>아직 남은 칸</span></div>
    </div>
    <div class="card stack resbox hidden"></div>
  </div>`);
  root.appendChild(el);
  const simbox = $('.simbox', el), resbox = $('.resbox', el);
  const N = $('#simN', el), T = $('#simT', el), SP = $('#simSp', el);
  const cvS = $('#pSeq canvas', el), cvB = $('#pBin canvas', el);
  let n = 100, target = 73, seq, bin, timer = null, pred = ss.logs.predictChoice ?? null, runs = 0;
  const lockSim = (on) => { simbox.style.opacity = on ? .45 : 1; simbox.style.pointerEvents = on ? 'none' : 'auto'; if (on) simbox.setAttribute('inert', ''); else simbox.removeAttribute('inert'); };
  lockSim(pred === null);
  const predBtns = $$('.pred .opt', el);
  const lockPred = () => predBtns.forEach((b, i) => { b.disabled = true; b.classList.toggle('sel', i === pred); });
  if (pred !== null) lockPred();
  predBtns.forEach(b => b.onclick = () => { pred = +b.dataset.i; ss.logs.predictChoice = pred; ctx.save(); lockPred(); lockSim(false); toast('예측 완료! 이제 실험해 보세요.'); });

  const reset = () => {
    stop(); n = +N.value; target = Math.min(n, Math.max(1, +T.value || 1)); T.value = target; T.max = n;
    $('.nv', el).textContent = n; $('.nmax', el).textContent = n;
    seq = { i: 0, cur: -1, count: 0, found: false };
    bin = { lo: 0, hi: n - 1, mid: -1, count: 0, found: false, log: '' };
    $('#pSeq .say', el).textContent = '앞에서부터 한 칸씩 확인해요.'; $('#pBin .say', el).textContent = '가운데를 확인하고 절반을 지워요.';
    $$('.panel', el).forEach(p => p.classList.remove('win'));
    draw();
  };
  const layout = (w) => { const cell = Math.max(3, Math.min(34, Math.floor(Math.sqrt((w * 150) / n)))); const cols = Math.max(1, Math.floor(w / cell)); const rows = Math.ceil(n / cols); return { cell, cols, rows }; };
  const drawGrid = (cv, colorOf) => {
    const w0 = cv.clientWidth || 300; const L = layout(w0);
    const { c } = fitCanvas(cv, L.rows * L.cell);
    for (let i = 0; i < n; i++) {
      const x = (i % L.cols) * L.cell, y = Math.floor(i / L.cols) * L.cell; const g = L.cell > 6 ? 1.5 : 0.5;
      c.fillStyle = colorOf(i); c.fillRect(x + g, y + g, L.cell - 2 * g, L.cell - 2 * g);
      if (L.cell >= 26) { c.fillStyle = '#25222E'; c.font = `${Math.floor(L.cell * 0.36)}px sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(i + 1, x + L.cell / 2, y + L.cell / 2); }
    }
  };
  const draw = () => {
    drawGrid(cvS, i => (seq.found && i === seq.cur) ? '#2E7D5B' : i === seq.cur ? '#E9982F' : i < seq.i || (i <= seq.cur) ? '#b9b2a5' : '#dce8f6');
    drawGrid(cvB, i => (bin.found && i === bin.mid) ? '#2E7D5B' : i === bin.mid ? '#E9982F' : (i < bin.lo || i > bin.hi) ? '#b9b2a5' : '#dce8f6');
    $('#pSeq .c', el).textContent = seq.count; $('#pBin .c', el).textContent = bin.count;
  };
  const stepOnce = () => {
    if (!seq.found) { seq.cur = seq.i; seq.count++; if (seq.i + 1 === target) { seq.found = true; $('#pSeq .say', el).textContent = `${seq.i + 1}번 칸 확인 → 찾았어요! 총 ${seq.count}번 비교`; } else { $('#pSeq .say', el).textContent = `${seq.i + 1}번 칸 확인 → ${target}이 아니에요. 다음 칸으로.`; seq.i++; } }
    if (!bin.found) {
      const m = midOf(bin.lo, bin.hi); bin.mid = m; bin.count++; const v = m + 1;
      if (v === target) { bin.found = true; $('#pBin .say', el).textContent = `가운데 ${v}번 칸 확인 → 찾았어요! 총 ${bin.count}번 비교`; }
      else if (v < target) { $('#pBin .say', el).textContent = `가운데 ${v}번 칸 확인 → ${target}보다 작아요 → 오른쪽 절반만 남겨요.`; bin.lo = m + 1; }
      else { $('#pBin .say', el).textContent = `가운데 ${v}번 칸 확인 → ${target}보다 커요 → 왼쪽 절반만 남겨요.`; bin.hi = m - 1; }
    }
    draw();
    if (seq.found && bin.found) { stop(); finishRun(); }
  };
  const stop = () => { if (timer) { clearInterval(timer); timer = null; } $('[data-a=play]', el).textContent = '자동 재생 ▶'; };
  const play = () => {
    if (timer) { stop(); return; }
    if (seq.found && bin.found) reset();
    const sp = +SP.value; const per = Math.max(1, Math.round(Math.pow(1.9, sp - 4))); const ms = Math.max(16, 520 - sp * 50);
    $('[data-a=play]', el).textContent = '일시정지 ⏸';
    timer = setInterval(() => { for (let k = 0; k < (seq.found ? 1 : per) && !(seq.found && bin.found); k++) stepOnce(); }, ms);
  };
  CLEANUP.push(stop);
  const finishRun = () => {
    runs++; $('#pBin', el).classList.add('win');
    const n2 = n * 2; const correct = pred === 1;
    if (ss.logs.predict === undefined) ctx.log('predict', correct);
    const rows = [[10], [100], [1000], [1000000]].map(([k]) => k);
    resbox.classList.remove('hidden');
    resbox.innerHTML = `<h3>🔎 예측 확인</h3>
      <div class="msg ${correct ? 'ok' : 'warn'}">내 예측: ‘${['2배가 된다', '1번 늘어난다', '변하지 않는다', '절반이 된다'][pred]}’ → ${correct ? '정답이에요! 🎉' : '정답은 ‘1번 늘어난다’예요.'}</div>
      <p>이번 실험: 순차 <b>${seq.count}번</b> vs 이진 <b>${bin.count}번</b>. 창고 ${n.toLocaleString()}칸과 2배인 ${n2.toLocaleString()}칸의 <b>최대</b> 비교 횟수를 비교해 보세요.</p>
      <div style="overflow-x:auto"><table class="table"><thead><tr><th>창고 칸 수</th><th>순차 탐색 (최대)</th><th>이진 탐색 (최대)</th></tr></thead><tbody>
      <tr class="hl"><td>${n.toLocaleString()} (지금)</td><td>${n.toLocaleString()}번</td><td>${binMax(n)}번</td></tr>
      <tr class="hl"><td>${n2.toLocaleString()} (2배)</td><td>${n2.toLocaleString()}번 <span class="small">(2배)</span></td><td>${binMax(n2)}번 <span class="small">(+${binMax(n2) - binMax(n)})</span></td></tr>
      ${rows.map(k => `<tr><td>${k.toLocaleString()}</td><td>${k.toLocaleString()}번</td><td>${binMax(k)}번</td></tr>`).join('')}
      </tbody></table></div>
      <p class="small muted">이진 탐색은 한 번 확인할 때마다 남은 칸이 절반으로 줄어요. “반으로 몇 번 나누면 1칸이 남을까?”를 생각하면 최대 횟수를 알 수 있어요. 창고가 2배가 되어도 한 번만 더 나누면 되지요!</p>`;
    onChecked && onChecked();
  };
  N.oninput = reset; T.onchange = reset;
  $('[data-a=step]', el).onclick = () => { stop(); if (seq.found && bin.found) reset(); stepOnce(); };
  $('[data-a=play]', el).onclick = play;
  $('[data-a=reset]', el).onclick = reset;
  $('[data-a=rnd]', el).onclick = () => { T.value = rand(1, +N.value); reset(); };
  const ro = new ResizeObserver(() => draw()); ro.observe(cvS); CLEANUP.push(() => ro.disconnect());
  reset();
  return el;
}

/* ---------- 심화: 반으로 나누기 ---------- */
function halvingActivity(root, total, onDone) {
  const el = h(`<div class="card stack"><h3>✂️ ${total.toLocaleString()}칸 창고를 반으로 나눠 보기</h3>
    <p>버튼을 누를 때마다 가운데를 확인하고 절반을 지워요. 몇 번 만에 1칸이 남을까요?</p>
    <div class="row"><button class="btn primary small" data-a="cut">가운데 확인하고 반 지우기 ✂️</button><span class="stat">확인 횟수 <b class="k">0</b></span></div>
    <div class="halve"></div><div class="hfb"></div></div>`);
  root.appendChild(el);
  let size = total, k = 0; const list = $('.halve', el);
  const add = () => { list.appendChild(h(`<div><span style="width:6.5em;text-align:right">${size.toLocaleString()}칸</span><span class="bar" style="width:${Math.max(0.4, (size / total) * 100) * 2.4}px"></span></div>`)); list.scrollTop = list.scrollHeight; };
  add();
  $('[data-a=cut]', el).onclick = (e) => {
    if (size <= 1) return;
    k++; size = Math.floor(size / 2); $('.k', el).textContent = k; add();
    if (size <= 1) { e.target.disabled = true; $('.hfb', el).innerHTML = `<div class="msg ok">${k}번 만에 1칸이 남았어요! 마지막 1칸까지 확인하면 ${total.toLocaleString()}칸 창고도 <b>최대 ${binMax(total)}번</b>이면 충분해요.</div>`; onDone && onDone(); }
  };
}

/* =========================================================
   분기 단계 (탐색·정렬 공통)
   ========================================================= */
function branchStep(root, ctx, secId) {
  const ss = ctx.ss; const isSearch = secId === 'search';
  const POOL = isSearch ? SEARCH_POOL : SORT_POOL;
  if (ss.score === undefined) { root.appendChild(h('<div class="msg warn">먼저 형성평가를 끝내 주세요.</div>')); return; }
  const path = decidePath(ss.score); if (!ss.path) { ss.path = path; save(); }
  const wrong = [...new Set(ss.wrongTags || [])];
  const pc = { '보충': 'p1', '맞춤 복습': 'p2', '심화': 'p3' }[path];
  const head = h(`<div class="card stack"><h2>🧭 나의 다음 경로</h2>
    <p>형성평가 객관식 <b>${ss.score}/5</b> → <span class="path ${pc}">${path === '보충' ? '🛠️ 보충' : path === '맞춤 복습' ? '🎯 맞춤 복습' : '🚀 심화'}</span></p>
    <p class="muted small">${path === '보충' ? '틀린 개념을 다시 보고, 힌트와 함께 따라 해 본 뒤 재평가 2문항을 풀어요.' : path === '맞춤 복습' ? '틀린 문항의 개념만 짧게 복습하고, 비슷한 문항에 다시 도전해요.' : '모두 맞혔어요! 한 단계 더 나아간 내용을 맛보기로 살펴봐요.'}</p></div>`);
  root.appendChild(head);
  if (ss.branchDone) {
    root.appendChild(h(`<div class="msg ok">이미 완료한 경로예요. 재평가 결과: <b>${esc(ss.retest)}</b>. ‘다음’을 눌러 결과 리포트로 가요.</div>`));
    ctx.markDone(); return;
  }
  const body = h('<div class="stack"></div>'); root.appendChild(body);
  const conceptOf = isSearch ? SEARCH_TAG_CONCEPT : SORT_TAG_CONCEPT;
  const finish = (result) => {
    ss.retest = result; ss.branchDone = true; save();
    if (result === '미통과') body.appendChild(h(`<div class="msg bad">아직 헷갈리는 부분이 남아 있어요. 🙋 손을 들고 <b>선생님께 질문</b>해 보세요. 리포트에 표시되어 선생님이 도와줄 거예요.</div>`));
    else if (result === '통과') body.appendChild(h(`<div class="msg ok">재평가 통과! 🎉 마지막으로 개념을 정리하고 마무리해요.</div>`));
    if (result !== '해당 없음') body.appendChild(h(`<div class="concept"><div class="tag">💡 개념 정리</div><p>${isSearch ? SEARCH_CONCEPT[5].card : SORT_CONCEPT.wrap.card}</p></div>`));
    ctx.markDone();
  };

  // 탐색 ②에서 7칸 이상 열었으면 점수와 관계없이 '가운데 고르기' 추천
  if (isSearch && path !== '보충' && (ss.logs.binOpened || 0) >= 7) {
    const rec = h(`<div class="card stack"><h3>⭐ 추천 활동 · 가운데 고르기 따라 하기</h3><p class="small muted">직접 탐색 ②에서 ${ss.logs.binOpened}칸을 열었어요. 가운데를 고르면 최대 ${binMax(31)}칸이면 충분해요. 한 번 따라 해 볼까요? (선택 활동)</p><button class="btn small">따라 해 보기</button><div class="recbox"></div></div>`);
    body.appendChild(rec);
    $('button', rec).onclick = (e) => { e.target.remove(); binaryActivity($('.recbox', rec), { n: 15, zmax: 10, guided: true }); };
  }

  if (path === '보충') {
    body.appendChild(h(`<div class="card stack"><h3>📘 틀린 개념 다시 보기</h3>${wrong.map(t => `<div class="concept"><div class="tag">#${esc(t)}</div><p>${conceptOf[t]}</p></div>`).join('')}</div>`));
    const act = h(`<div class="card stack"><h3>🛠️ 힌트와 함께 따라 하기</h3><div class="ab"></div></div>`); body.appendChild(act);
    const goRetest = () => {
      if ($('.rt', body)) return;
      const tags = wrong.length >= 2 ? wrong.slice(0, 2) : [wrong[0], wrong[0]];
      const qs = tags.map((t, i) => POOL[t][tags[0] === tags[1] ? i : 0]);
      const rt = h('<div class="rt"></div>'); body.appendChild(rt);
      retestBlock(rt, qs, ok => finish(ok ? '통과' : '미통과'));
      rt.scrollIntoView({ behavior: 'smooth' });
    };
    if (isSearch) {
      const useSeq = !wrong.some(t => t.startsWith('이진')) && wrong.includes('순차 과정');
      if (useSeq) sequentialActivity($('.ab', act), { n: 10, zmax: 10, guided: true, onFinish: () => setTimeout(goRetest, 600) });
      else binaryActivity($('.ab', act), { n: 15, zmax: 10, guided: true, onFinish: () => setTimeout(goRetest, 600) });
    } else {
      const which = (wrong.find(t => /선택|버블|삽입/.test(t)) || '선택 과정').slice(0, 2);
      const kind = { '선택': 'selection', '버블': 'bubble', '삽입': 'insertion' }[which];
      sortFollow($('.ab', act), { kind, arr: shuffle(sampleDistinct(6, 1, 30)), zmax: 20, showRule: true, onFinish: () => setTimeout(goRetest, 600) });
    }
  } else if (path === '맞춤 복습') {
    body.appendChild(h(`<div class="card stack"><h3>🎯 틀린 개념만 짧게 복습</h3>${wrong.map(t => `<div class="concept"><div class="tag">#${esc(t)}</div><p>${conceptOf[t]}</p></div>`).join('')}</div>`));
    const qs = wrong.map(t => POOL[t][0]);
    retestBlock(body, qs, ok => finish(ok ? '통과' : '미통과'), { title: '재도전' });
  } else {
    if (isSearch) {
      halvingActivity(body, 1000000, () => {
        body.appendChild(h(`<div class="card stack"><h3>📐 빅오(O) 표기 맛보기</h3>
          <p>데이터 개수를 <b>n</b>이라 할 때, 비교 횟수가 n에 따라 <b>어떻게 늘어나는지</b>를 간단히 나타내는 표기예요.</p>
          <div style="overflow-x:auto"><table class="table"><thead><tr><th>표기</th><th>뜻</th><th>예</th><th>n = 1,000,000</th></tr></thead><tbody>
          <tr><td><b>O(n)</b></td><td>n에 비례해 늘어남</td><td>순차 탐색</td><td>최대 1,000,000번</td></tr>
          <tr><td><b>O(log n)</b></td><td>“반으로 몇 번 나누면 1이 될까?”만큼 늘어남</td><td>이진 탐색</td><td>최대 20번</td></tr>
          <tr><td><b>O(n²)</b></td><td>n의 제곱에 비례 (정렬 섹션에서 만나요)</td><td>선택·버블 정렬</td><td>약 1조 번</td></tr></tbody></table></div></div>`));
        body.appendChild(h(`<div class="card stack"><h3>🌏 생활 속 이진 탐색</h3><div class="grid2">
          <div class="goal"><span class="n">📖</span><span><b>종이 사전 찾기</b> — 가운데쯤 펼쳐 보고 앞뒤 절반을 고른다.</span></div>
          <div class="goal"><span class="n">🔢</span><span><b>업다운 게임</b> — 1단계 주파수 맞히기가 바로 이진 탐색!</span></div>
          <div class="goal"><span class="n">📚</span><span><b>도서관 청구기호</b> — 번호순 서가에서 범위를 좁혀 간다.</span></div>
          <div class="goal"><span class="n">🐞</span><span><b>버그 찾기</b> — 문제가 생긴 시점을 절반씩 좁혀 찾는다 (git bisect).</span></div></div></div>`));
        retestBlock(body, [{ tag: '효율성', prompt: '번호순으로 정리된 <b>100만 칸</b> 창고에서 이진 탐색으로 찾을 때 최대 몇 번 비교할까요?', options: ['20번', '1,000번', '50만 번', '100만 번'], answer: 0, expl: '반으로 나누기를 거듭하면 100만 칸도 최대 20번이면 끝나요. 순차 탐색이면 최대 100만 번!' }], () => finish('해당 없음'), { title: '심화 도전' });
      });
    } else {
      advancedSort(body, () => retestBlock(body, [{ tag: '효율성', prompt: '상자 수가 10배가 될 때 비교 횟수가 대략 <b>100배</b>로 늘어나는 정렬은?', options: ['병합 정렬', '퀵 정렬(평균)', '선택 정렬', '정렬은 모두 10배만 는다'], answer: 2, expl: '선택 정렬은 O(n²)이라 n이 10배면 비교 횟수가 약 100배로 늘어요. 퀵·병합 정렬은 평균 O(n log n)이라 훨씬 덜 늘어요.' }], () => finish('해당 없음'), { title: '심화 도전' }));
    }
  }
}

const SEARCH_TAG_CONCEPT = {
  '순차 과정': SEARCH_CONCEPT[2].card,
  '이진 조건': '이진 탐색은 가운데 값과 비교해 찾는 값이 어느 쪽에 있는지 판단해요. 그래서 데이터가 <b>크기 순서로 정렬</b>되어 있어야만 쓸 수 있어요.',
  '이진 과정': SEARCH_CONCEPT[3].card + ' 범위 칸 수가 짝수면 <b>왼쪽 가운데</b>를 골라요.',
  '효율성': SEARCH_CONCEPT[4].card,
  '상황 적용': SEARCH_CONCEPT[5].card + ' 한 번만 찾는데 정렬부터 하면 오히려 오래 걸려요.',
};

/* =========================================================
   섹션 2 · 정렬  (단계 0~7)

/* ---------- 정렬 연산 기록 (시뮬레이션과 직접 해 보기가 같은 규칙) ---------- */
function opsSelection(a) { a = a.slice(); const ops = [], n = a.length; for (let i = 0; i < n - 1; i++) { let m = i; for (let j = i + 1; j < n; j++) { ops.push(['c', m, j]); if (a[j] < a[m]) m = j; } if (m !== i) { ops.push(['s', i, m]);[a[i], a[m]] = [a[m], a[i]]; } } return ops; }
function opsBubble(a) { a = a.slice(); const ops = [], n = a.length; for (let i = 0; i < n - 1; i++) for (let j = 0; j < n - 1 - i; j++) { ops.push(['c', j, j + 1]); if (a[j] > a[j + 1]) { ops.push(['s', j, j + 1]);[a[j], a[j + 1]] = [a[j + 1], a[j]]; } } return ops; }
function opsInsertion(a) { a = a.slice(); const ops = [], n = a.length; for (let i = 1; i < n; i++) { let j = i; while (j > 0) { ops.push(['c', j - 1, j]); if (a[j - 1] > a[j]) { ops.push(['s', j - 1, j]);[a[j - 1], a[j]] = [a[j], a[j - 1]]; j--; } else break; } } return ops; }
function opsQuick(a) {
  a = a.slice(); const ops = [];
  const sw = (i, j) => { if (i !== j) { ops.push(['s', i, j]);[a[i], a[j]] = [a[j], a[i]]; } };
  const qs = (lo, hi) => { if (lo >= hi) return; const mid = Math.floor((lo + hi) / 2); sw(mid, hi); let p = lo; for (let j = lo; j < hi; j++) { ops.push(['c', j, hi]); if (a[j] < a[hi]) { sw(p, j); p++; } } sw(p, hi); qs(lo, p - 1); qs(p + 1, hi); };
  qs(0, a.length - 1); return ops;
}
function opsMerge(a) {
  a = a.slice(); const ops = [];
  const ms = (lo, hi) => { if (hi - lo < 1) return; const mid = Math.floor((lo + hi) / 2); ms(lo, mid); ms(mid + 1, hi); const L = a.slice(lo, mid + 1), R = a.slice(mid + 1, hi + 1); let i = 0, j = 0, k = lo; while (i < L.length && j < R.length) { ops.push(['c', lo + i, mid + 1 + j]); if (L[i] <= R[j]) { ops.push(['w', k, L[i]]); a[k++] = L[i++]; } else { ops.push(['w', k, R[j]]); a[k++] = R[j++]; } } while (i < L.length) { ops.push(['w', k, L[i]]); a[k++] = L[i++]; } while (j < R.length) { ops.push(['w', k, R[j]]); a[k++] = R[j++]; } };
  ms(0, a.length - 1); return ops;
}

/* ---------- 활동: 내 방식대로 정리 (두 개 골라 자리 바꾸기) ---------- */
function freeSort(root, arr, onFinish) {
  const a = arr.slice(); let sel = -1, swaps = 0, done = false;
  const el = h(`<div class="card stack"><p>상자 <b>두 개</b>를 차례로 누르면 자리가 바뀌어요. 왼쪽부터 <b>작은 번호 → 큰 번호</b> 순서로 정리하세요.</p>
    <div class="stats"><span class="stat">교환 <b class="sw">0</b>번</span></div><div class="tiles"></div><div class="fb"></div></div>`);
  const zt = zombieTrack(20); el.insertBefore(zt.el, el.children[1]); root.appendChild(el);
  const draw = () => {
    $('.tiles', el).innerHTML = a.map((v, i) => tileHtml(v, i, (i === sel ? 'sel ' : '') + (done ? 'fixed' : ''), done ? 'disabled' : '')).join('');
    $$('.tile', el).forEach(t => t.onclick = () => {
      if (done) return; const i = +t.dataset.i;
      if (sel === -1) { sel = i; draw(); return; }
      if (sel === i) { sel = -1; draw(); return; }
      [a[sel], a[i]] = [a[i], a[sel]]; sel = -1; swaps++; zt.step(); $('.sw', el).textContent = swaps;
      if (isSorted(a)) { done = true; $('.fb', el).innerHTML = `<div class="msg ok">✅ 정리 완료! 교환 <b>${swaps}번</b>으로 번호순 정리를 끝냈어요.</div>`; onFinish && onFinish(swaps); }
      draw();
    });
  };

}

      const area = h('<div class="stack"></div>'); root.appendChild(area);
      if (ss.partIdx === undefined) ss.partIdx = 0;
      const drawTabs = (cur) => tabs.innerHTML = parts.map(([k], i) => `<span class="t ${i < ss.partIdx || ss.done[2] ? 'done' : ''} ${i === cur ? 'now' : ''}">${i < ss.partIdx || ss.done[2] ? '✓ ' : ''}${ALGOS[k].icon} ${ALGOS[k].name}</span>`).join('');
      const showPart = (pi) => {
        cleanup(); area.innerHTML = ''; drawTabs(pi);
        const [kind, rkey, ckey, av, line] = parts[pi];
        story(area, [`${ALGOS[kind].who}: “${line}”`], { name: ALGOS[kind].who, avatar: av, skip: true });
        const cr = h('<div class="stack"></div>');
        const after = () => {
          cr.innerHTML = '';
          conceptReason(cr, { key: rkey, ...SORT_CONCEPT[ckey] }, ctx, () => {
            if ($('.nextpart', cr)) return;
            if (pi < 2) { const b = h(`<button class="btn primary nextpart">다음 선배에게 ▶ ${ALGOS[parts[pi + 1][0]].name}</button>`); b.onclick = () => { if (ss.partIdx < pi + 1) { ss.partIdx = pi + 1; save(); } showPart(pi + 1); window.scrollTo({ top: 0, behavior: 'smooth' }); }; cr.appendChild(b); }
            else { if (ss.partIdx < 3) { ss.partIdx = 3; save(); } drawTabs(-1); cr.appendChild(h(`<div class="msg ok nextpart">세 선배의 방법을 모두 따라 했어요! 같은 상자인데 비교·교환 횟수가 어땠나요? 선택 ${ss.logs.selection.cmp}/${ss.logs.selection.swp}, 버블 ${ss.logs.bubble.cmp}/${ss.logs.bubble.swp}, 삽입 ${ss.logs.insertion.cmp}/${ss.logs.insertion.swp} (비교/교환)</div>`)); ctx.markDone(); }
          });
        };
        sortFollow(area, { kind, arr: baseArr(ss), zmax: 30, onFinish: (r) => { ctx.log(kind, r); after(); } });
        area.appendChild(cr);
        if (ss.reasons[rkey] && ss.logs[kind]) after();
        // 이미 지나간 선배는 탭으로 다시 볼 수 있음
        $$('.t', tabs).forEach((t, i) => { if (i <= ss.partIdx && i < 3) { t.style.cursor = 'pointer'; t.onclick = () => showPart(i); } });
      };
      showPart(Math.min(ss.partIdx, 2));
    } },
    { name: '시뮬레이션 · 세 정렬 겨루기', async render(root, ctx) {
      await story(root, ['누구 방법이 가장 빠를까요?', '상자 수와 처음 상태를 바꿔 가며 세 방법을 겨뤄 봐요.'], { skip: !!ctx.ss.done[3] });
      const cr = h('<div></div>'); let shown = false;
      raceSim(root, ctx, { algos: ['selection', 'bubble', 'insertion'], predict: true, onFinish: () => { if (shown) return; shown = true; conceptReason(cr, { key: 't3', ...SORT_CONCEPT[3] }, ctx, () => ctx.markDone()); } });
      root.appendChild(cr);
      if (ctx.ss.done[3]) { shown = true; conceptReason(cr, { key: 't3', ...SORT_CONCEPT[3] }, ctx, () => ctx.markDone()); }
    } },
    { name: '개념 정리 · 세 정렬 비교', async render(root, ctx) {
      root.appendChild(h(`<div class="card stack"><h2>🧾 세 정렬 비교 카드</h2><p class="muted">빈칸을 골라 비교 카드를 완성하세요.</p><div class="ft"></div></div>`));
      const cr = h('<div></div>');
      fillTable($('.ft', root), {
        head: ['', '👆 선택 정렬', '🫧 버블 정렬', '🃏 삽입 정렬'],
        rows: [
          ['원리', '남은 것 중 {{가장 작은 값|이웃한 값|가운데 값}}을 찾아 맨 앞과 바꾼다', '{{이웃한 두 값|맨 앞과 맨 뒤|가운데와 끝}}을 비교해 큰 값을 뒤로 보낸다', '하나씩 꺼내 {{정리된 앞부분|맨 뒤|가운데}}의 알맞은 자리에 끼운다'],
          ['한 회전(바퀴) 뒤', '{{맨 앞|맨 뒤|가운데}} 자리가 확정된다', '가장 큰 값이 {{맨 뒤|맨 앞|가운데}}로 간다', '앞부분이 한 칸 더 정리된다'],
          ['특징', '비교 횟수가 처음 상태와 {{관계없이 같다|관계있다}}', '교환이 많이 일어날 수 있다', '{{거의 정렬된|역순인|무작위인}} 데이터에서 특히 빠르다'],
        ],
      }, () => { cr.innerHTML = ''; conceptReason(cr, { key: 't4', ...SORT_CONCEPT[4] }, ctx, () => ctx.markDone()); });
      root.appendChild(cr);
      if (ctx.ss.done[4]) conceptReason(cr, { key: 't4', ...SORT_CONCEPT[4] }, ctx, () => ctx.markDone());
    } },
    { name: '형성평가', async render(root, ctx) {
      root.appendChild(h(`<div class="row small muted">학습 목표 ① 수행 과정 · ② 비교·교환 횟수와 특징 에 맞춘 문항이에요.</div>`));
      formativeBlock(root, ctx, { questions: SORT_Q, essay: SORT_ESSAY, onComplete: () => ctx.markDone() });
    } },
    { name: '보충 · 맞춤 복습 · 심화', async render(root, ctx) { branchStep(root, ctx, 'sort'); } },
    { name: '결과 · 에필로그', async render(root, ctx) {
      const L = ctx.ss.logs; const f = k => L[k] ? `비교 ${L[k].cmp} · 교환 ${L[k].swp}` : '-';
      reportBlock(root, 'sort', [
        ['도입: 자유 정리', L.freeSwaps !== undefined ? `교환 ${L.freeSwaps}번` : '-'],
        ['선택 정렬', f('selection')], ['버블 정렬', f('bubble')], ['삽입 정렬', f('insertion') + ' (밀기)'],
        ['힌트 사용', `${['selection', 'bubble', 'insertion'].reduce((s, k) => s + (L[k] ? L[k].hints : 0), 0)}번`],
        ['시뮬레이션 예측', L.predict === undefined ? '-' : L.predict ? '정답' : '오답'],
      ]);
      await story(root, ['모든 창고가 정리됐어요! 이제 이진 탐색으로 백신을 바로 찾을 수 있어요.', '저 소리 들리나요? 구조 헬기가 도착했어요! 🚁', '생존 대원님, 정말 수고 많았어요. 생존 인증서를 받아 가세요!'], { cta: '확인 ✓' });
      const b = h(`<div class="row"><button class="btn amber">🎖️ 생존 인증서 보기</button></div>`); b.firstElementChild.onclick = showCert; root.appendChild(b);
      ctx.markDone();
    } },
  ],
};

/* ---------------- 시작 ---------------- */
(function init() {
  if (S.student && S.view === 'cert') showCert();
  else if (S.student) goHub();
  else goStart();
})();

</script>
</body>
